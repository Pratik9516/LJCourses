<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Instructor - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>body { background: #f0f2f5; }</style>
</head>
<body>
<div class="container" style="max-width:500px; margin-top:60px; margin-bottom:60px">
    <div class="card border-0 rounded-4 shadow-sm">
        <div class="card-body p-5">
            <a href="{{ url_for('admin.dashboard') }}" class="text-muted text-decoration-none d-flex align-items-center gap-1 mb-4">
                <span class="material-icons">arrow_back</span> Back to Dashboard
            </a>
            <h4 class="fw-bold mb-4">
                <span class="material-icons align-middle text-success me-2">person_add</span>Add Instructor
            </h4>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} rounded-3">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-medium">Full Name *</label>
                    <input type="text" name="full_name" class="form-control rounded-3"
                           placeholder="e.g. Prof. Rajesh Shah" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Email *</label>
                    <input type="email" name="email" class="form-control rounded-3"
                           placeholder="instructor@ljku.edu.in" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Password *</label>
                    <input type="password" name="password" class="form-control rounded-3"
                           placeholder="Set a password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium">Designation</label>
                    <input type="text" name="designation" class="form-control rounded-3"
                           placeholder="e.g. Assistant Professor, CS Department">
                </div>
                <button type="submit" class="btn btn-success btn-lg w-100 rounded-3">
                    <span class="material-icons align-middle me-1">add</span> Create Instructor
                </button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
