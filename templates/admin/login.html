<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - LJCourses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .login-card { max-width: 400px; margin: 100px auto; }
        .brand-icon { font-size: 3rem; color: #0d6efd; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="card shadow border-0 rounded-4">
        <div class="card-body p-5 text-center">
            <span class="material-icons brand-icon">admin_panel_settings</span>
            <h3 class="fw-bold mt-2 mb-1">Admin Panel</h3>
            <p class="text-muted mb-4">LJCourses Management</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} rounded-3">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3 text-start">
                    <label class="form-label fw-medium">Admin Password</label>
                    <input type="password" name="password" class="form-control form-control-lg rounded-3"
                           placeholder="Enter admin password" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3">
                    <span class="material-icons align-middle me-1">login</span> Login
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
