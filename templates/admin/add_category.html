<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Category - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>body { background: #f0f2f5; }</style>
</head>
<body>
<div class="container" style="max-width:500px; margin-top:60px">
    <div class="card border-0 rounded-4 shadow-sm">
        <div class="card-body p-5">
            <a href="{{ url_for('admin.dashboard') }}" class="text-muted text-decoration-none d-flex align-items-center gap-1 mb-4">
                <span class="material-icons">arrow_back</span> Back to Dashboard
            </a>
            <h4 class="fw-bold mb-4">
                <span class="material-icons align-middle text-primary me-2">category</span>Add Category
            </h4>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} rounded-3">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <div class="mb-4">
                    <label class="form-label fw-medium">Category Name *</label>
                    <input type="text" name="name" class="form-control form-control-lg rounded-3"
                           placeholder="e.g. Web Development" required>
                    <small class="text-muted">Slug will be created automatically</small>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3">
                    <span class="material-icons align-middle me-1">add</span> Create Category
                </button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
